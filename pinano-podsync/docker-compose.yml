services:
  app_proxy:
    environment:
      APP_HOST: pinano-podsync_server_1
      APP_PORT: 8080
    container_name: pinano-podsync_app_proxy_1
  server:
    image: ghcr.io/pinano/podsync:latest
    init: true
    volumes:
      - ${UMBREL_ROOT}/home/Downloads/podsync/config.toml:/app/config.toml
      - ${UMBREL_ROOT}/home/Downloads/podsync/data:/app/data
      - ${UMBREL_ROOT}/home/Downloads/podsync/yt-dlp.conf:/etc/yt-dlp/config:ro
      - ${UMBREL_ROOT}/home/Downloads/podsync/yt-dlp.conf:/etc/yt-dlp.conf:ro
    restart: on-failure
    stop_grace_period: 1m
    container_name: pinano-podsync_server_1
